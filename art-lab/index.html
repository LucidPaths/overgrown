<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>overgrown · art lab</title>
<style>
html,body{margin:0;height:100%;background:#16222e;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}
.hud{position:fixed;left:8px;top:6px;font:12px/1.2 ui-monospace,monospace;color:#f6efd8;text-shadow:1px 1px 0 #20202c;pointer-events:none;opacity:.85}
.err{position:fixed;inset:20px;background:#20202cdd;color:#ffb0a0;font:12px ui-monospace,monospace;white-space:pre-wrap;overflow:auto;padding:12px}
.touch{position:fixed;inset:0;pointer-events:none;display:none}
.touch.on{display:block}
.touch .stick{position:absolute;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;border:2px solid #f6efd855;display:none}
.touch .knob{position:absolute;left:30px;top:30px;width:32px;height:32px;border-radius:50%;background:#f6efd855}
.touch .b{position:absolute;pointer-events:auto;border:3px solid #20202c;border-radius:14px;box-shadow:inset 0 -5px 0 #0003;touch-action:none}
.touch .atk{right:calc(22px + env(safe-area-inset-right));bottom:calc(34px + env(safe-area-inset-bottom));width:76px;height:76px;background:#e8a23a}
.touch .dodge{right:calc(112px + env(safe-area-inset-right));bottom:calc(24px + env(safe-area-inset-bottom));width:56px;height:56px;background:#5aa6c8}
</style>
</head>
<body><canvas id="c"></canvas><script type="module" src="/src/main.ts"></script></body>
</html>
