name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r tools/art/requirements-dev.txt
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: ~/.local/opt/godot
          key: godot-4.7.2-${{ runner.os }}
      - run: tools/godot/setup.sh --no-blender
      - run: tools/godot/test.sh
