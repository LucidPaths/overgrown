name: Release

# push to main   -> the rolling pre-release "latest (main)"
# push of v*     -> a versioned release (the tag must equal "v" + GameVersion.VERSION)
# manual run     -> the same, depending on which ref it was started on (main or a v* tag)
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time: two quick merges must not delete each other's "latest" half-way through.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the ref is main or a v* tag
        run: |
          case "$GITHUB_REF" in
            refs/heads/main | refs/tags/v*) ;;
            *) echo "release.yml: run it on main or a v* tag, not on $GITHUB_REF" >&2; exit 1 ;;
          esac

      - name: Check the tag matches GameVersion.VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^const VERSION := "\(.*\)"$/\1/p' game/version.gd)"
          if [ -z "$version" ]; then
            echo "release.yml: could not read VERSION from game/version.gd" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "release.yml: tag $GITHUB_REF_NAME does not match game/version.gd VERSION v$version" >&2
            exit 1
          fi

      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/opt/godot
            ~/.local/share/godot/export_templates
          key: godot-4.7.2-templates-${{ runner.os }}
      - run: tools/godot/setup.sh --no-blender --templates
      - run: tools/godot/test.sh
      - run: tools/godot/export.sh

      - name: Write the release notes
        run: |
          {
            if [ "$GITHUB_REF_TYPE" = "branch" ]; then
              echo "Rolling build of \`main\`, replaced on every merge."
              echo
              echo "- Commit: \`$GITHUB_SHA\`"
              echo "- Subject: $(git log -1 --format=%s)"
              echo "- Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo
            fi
            echo "## How to run"
            echo
            echo "**Windows:** download \`overgrown-windows.exe\` and double-click it. Nothing else to install."
            echo "The first time, Windows SmartScreen says \"unknown publisher\". Click *More info*, then *Run anyway*."
            echo
            echo "**Linux:** download \`overgrown-linux.x86_64\`, run \`chmod +x overgrown-linux.x86_64\`, then \`./overgrown-linux.x86_64\`."
          } > "$RUNNER_TEMP/notes.md"

      - name: Publish "latest (main)"
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            --prerelease \
            --title "latest (main)" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --target "$GITHUB_SHA" \
            game/export/windows/overgrown-windows.exe \
            game/export/linux/overgrown-linux.x86_64

      - name: Publish the versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag \
            game/export/windows/overgrown-windows.exe \
            game/export/linux/overgrown-linux.x86_64
